<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>共通テストカウントダウン 2028</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;700&family=Noto+Sans+JP:wght@300;500&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <header>
            <p class="subtitle">ROAD TO 2028</p>
            <h1>共通テストまで</h1>
        </header>

        <main class="countdown-box">
            <div class="display-item">
                <span id="days-left" class="main-number">---</span>
                <span class="main-unit">日</span>
            </div>
            
            <div class="divider"></div>

            <div class="display-item">
                <span id="detailed-left" class="main-number-sub">--年--か月--日</span>
            </div>
        </main>

        <footer>
            <p id="today-date" class="current-date">----年--月--日(--)</p>
            <p class="target-date">試験初日: 2028年1月15日(土)</p>
            <p class="message">一歩ずつ、確実に。</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
